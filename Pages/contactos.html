<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto Baratheon</title>
    <link rel="stylesheet" href="../css/style.css">

</head>

<body>
    <header class="encabezado">
        <img src="../src/Logo.svg" alt="Logo Baratheon">
        <nav class="menu">
            <a href="../index.html" class="ayestaras">Inicio</a>
            <a href="nosotros.html" class="ayestaras">Nosotros</a>
            <a href="galeria.html" class="ayestaras">Galería</a>
            <a href="productos.html" class="ayestaras">Productos</a>
            <a href="contactos.html" class="btncontactos">Contactos</a>
        </nav>

    </header>

    <main class="contacto-main">
        <section class="contacto-container">
            <div class="formulario-contacto">
                <h1>Contáctanos</h1>
                <p>Envía un cuervo a Bastión de Tormentas.</p>
                <form>
                    <input type="text" placeholder="Nombre" required>
                    <input type="email" placeholder="Correo electrónico" required>
                    <input type="text" placeholder="Asunto">
                    <textarea placeholder="Escribe tu mensaje"></textarea>
                    <button type="submit">Enviar Mensaje</button>
                </form>
            </div>
            <div class="mapa">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d4314.926417556265!2d-58.46430163454991!3d-34.841935991978936!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x95bcd183c5f866ff%3A0x5e7ac230c436ad7b!2sEscuela%20De%20Educaci%C3%B3n%20Secundaria%20T%C3%A9cnica%20N%C2%BA1!5e1!3m2!1sen!2sar!4v1779747008043!5m2!1sen!2sar" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
                    width="100%"
                    height="100%"
                    style="border:0;"
                    allowfullscreen=""
                    loading="lazy">
                </iframe>
            </div>
        </section>
    </main>
</body>
</html>
